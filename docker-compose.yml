services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_pipeline_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pipeline_secret}
      POSTGRES_DB: ${DB_NAME:-retail_warehouse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pipeline_user} -d ${DB_NAME:-retail_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local